# 알트코인 급등 뒤 숏 백테스트 자료 → alt-history 브랜치 (v2.73, 2026-11-14)
# 내용·이유는 tools/alt_history.py 머리말. main에는 아무것도 커밋하지 않는다.
# 이 파일이나 tools/alt_history.py가 바뀌어 push될 때와 수동 실행에만 돈다(한 번 받아 두는 용도).
name: alt history

on:
  push:
    branches: [main]
    paths: ['.github/workflows/alt_history.yml', 'tools/alt_history.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alt-history
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: python3 tools/alt_history.py out/alt
      - name: Commit to alt-history
        run: |
          ls -la out/alt
          cd out
          git init -q -b alt-history
          git config user.name "alt-history[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alt
          git commit -q -m "alt history $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" alt-history
